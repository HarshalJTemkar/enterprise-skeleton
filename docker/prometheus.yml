# Prometheus scrape configuration for the local docker-compose stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: enterprise-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:9000"]

  - job_name: config-server
    metrics_path: /actuator/prometheus
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ["config-server:8888"]

  - job_name: service-registry
    metrics_path: /actuator/prometheus
    basic_auth:
      username: eureka
      password: eureka
    static_configs:
      - targets: ["service-registry:8761"]
