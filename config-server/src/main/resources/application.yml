server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  security:
    user:
      name: ${CONFIG_SERVER_USER:admin}
      password: ${CONFIG_SERVER_PASSWORD:admin}
  cloud:
    config:
      server:
        # Native (file-system / classpath) profile – used for local dev
        native:
          search-locations: ${CONFIG_NATIVE_LOCATIONS:classpath:/config,file:./config-repo}
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/your-org/your-config-repo.git}
          default-label: ${CONFIG_GIT_BRANCH:main}
          clone-on-start: true
          search-paths:
            - '{application}'
            - '{application}/{profile}'

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh,busrefresh
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.config: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
---
spring:
  config:
    activate:
      on-profile: prod
  profiles:
    include: git
