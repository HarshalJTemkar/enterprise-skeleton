# Shared defaults served to all microservices by Spring Cloud Config.
# Place per-service overrides in files like auth-service.yml, api-gateway.yml, etc.

spring:
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers,refresh
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,diskSpace,ping
  info:
    git:
      mode: full
    build:
      enabled: true
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:default}
      region: ${DEPLOY_REGION:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        resilience4j.circuitbreaker.calls: true
  tracing:
    enabled: ${enterprise.common.observability.tracing.enabled:false}
    sampling:
      probability: ${enterprise.common.observability.tracing.sampling-probability:1.0}
  otlp:
    tracing:
      endpoint: ${enterprise.common.observability.tracing.endpoint:http://localhost:4318/v1/traces}

logging:
  style: ${LOG_STYLE:text}
  level:
    root: INFO
    com.enterprise: ${LOG_LEVEL_APP:INFO}

info:
  app:
    name: ${spring.application.name}
    description: ${spring.application.name} (enterprise-skeleton)
    profiles: ${spring.profiles.active:default}

enterprise:
  common:
    web:
      exception-handler:
        enabled: true
      cors:
        enabled: true
        allowed-origins: "*"
        allowed-methods: "*"
        allowed-headers: "*"
    security:
      enabled: false
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
      access-token-ttl: PT1H
      refresh-token-ttl: P7D
      issuer: enterprise-platform
      header-name: Authorization
      token-prefix: "Bearer "

    # ------------------------------------------------------------------
    # OpenAPI / Swagger  (enterprise.common.openapi.*)
    # ------------------------------------------------------------------
    openapi:
      enabled: true
      title: ${spring.application.name} API
      description: REST API for ${spring.application.name}
      version: 1.0.0
      contact-name: Platform Team
      contact-email: platform@enterprise.com
      license-name: Apache 2.0
      license-url: https://www.apache.org/licenses/LICENSE-2.0
      jwt-security-enabled: true
      security-scheme-name: bearerAuth

    # ------------------------------------------------------------------
    # Resilience4j defaults (one "default" instance per policy)
    # Override at: enterprise.common.resilience.<policy>.*
    # ------------------------------------------------------------------
    resilience:
      enabled: true
      circuit-breaker:
        enabled: true
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 5
        sliding-window-size: 20
        minimum-number-of-calls: 10
      rate-limiter:
        enabled: true
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
      time-limiter:
        enabled: true
        timeout-duration: 3s
        cancel-running-future: true
      retry:
        enabled: true
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0
      bulkhead:
        enabled: true
        max-concurrent-calls: 25
        max-wait-duration: 100ms

    # ------------------------------------------------------------------
    # Async + Parallel executors
    # ------------------------------------------------------------------
    async:
      enabled: true
      use-virtual-threads: true
      core-pool-size: 8
      max-pool-size: 32
      queue-capacity: 500
      thread-name-prefix: enterprise-async-
      parallel:
        enabled: true
        use-virtual-threads: true
        pool-size: 16
        thread-name-prefix: enterprise-parallel-

    # ------------------------------------------------------------------
    # Scheduler ( @Scheduled support )
    # ------------------------------------------------------------------
    scheduler:
      enabled: true
      use-virtual-threads: true
      pool-size: 5
      thread-name-prefix: enterprise-scheduler-
      await-termination-seconds: 20

    # ------------------------------------------------------------------
    # Internationalization  (enterprise.common.i18n.*)
    # ------------------------------------------------------------------
    i18n:
      enabled: true
      basenames:
        - classpath:i18n/messages
        - classpath:i18n/errors
      default-locale: en
      cache-duration: PT10M
      encoding: UTF-8
      use-code-as-default-message: true

    # ------------------------------------------------------------------
    # Logging filters (correlation id + access log + masking)
    # ------------------------------------------------------------------
    logging:
      correlation-id:
        enabled: true
        header-name: X-Correlation-ID
        mdc-key: correlationId
        generate-request-id: true
      access-log:
        enabled: true
        include-payload: true
        max-payload-length: 2048
        exclude-patterns:
          - /actuator/**
          - /favicon.ico
          - /v3/api-docs/**
          - /swagger-ui/**
      masking:
        enabled: true
        mask: "***"
        fields:
          - password
          - passwd
          - secret
          - token
          - access_token
          - refresh_token
          - authorization
          - apiKey
          - api_key
          - ssn
          - cardNumber
          - card_number
          - cvv
          - pin

    # Actuator /info contributor
    info:
      enabled: true

    # Password encoder defaults
    security:
      enabled: false
      password-encoder:
        enabled: true
        bcrypt-only: false
        bcrypt-strength: 10
      # Per-service JWT validation filter. Off by default — services that
      # accept tokens directly (i.e. bypass the gateway) flip this to true.
      resource-server:
        enabled: false

    # JPA auditing (createdBy / updatedBy auto-population)
    jpa:
      auditing:
        enabled: true

    # ------------------------------------------------------------------
    # Caching (Caffeine local OR Redis distributed)
    # ------------------------------------------------------------------
    cache:
      enabled: true
      type: caffeine             # switch to "redis" when a Redis bean is present
      names: []                  # pre-create cache names here (or leave empty)
      caffeine:
        maximum-size: 10000
        expire-after-write: PT10M
        record-stats: true
      redis:
        time-to-live: PT10M
        key-prefix: "cache:"
        cache-null-values: false

    # ------------------------------------------------------------------
    # Distributed tracing (Micrometer + OpenTelemetry)
    # ------------------------------------------------------------------
    observability:
      tracing:
        enabled: false           # turn on per-env via OTEL_TRACING_ENABLED=true
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
        sampling-probability: 1.0
        service-name: ${spring.application.name}

    # Outbound HTTP client (correlation-id + tenant propagation)
    http:
      client:
        enabled: true

    # Database migrations
    flyway:
      enabled: true

# ------------------------------------------------------------------
# Feature flags (audit, idempotency)
# ------------------------------------------------------------------
feature:
  audit:
    enabled: true
  idempotency:
    enabled: false              # Needs Redis; enable per service when Redis is wired in
    header-name: Idempotency-Key
    ttl: PT10M
    key-prefix: "idempotency:"

# Structured logging style – set to "json" in prod (uses logstash encoder)
logging:
  style: ${LOG_STYLE:text}
  level:
    root: INFO
    com.enterprise: DEBUG
    ACCESS: INFO
    AUDIT: INFO

# Native Resilience4j instance names also resolve to the same "default"
resilience4j:
  circuitbreaker:
    instances:
      default:
        base-config: default
  ratelimiter:
    instances:
      default:
        base-config: default
  timelimiter:
    instances:
      default:
        base-config: default
  retry:
    instances:
      default:
        base-config: default
  bulkhead:
    instances:
      default:
        base-config: default

# SpringDoc tuning (applies to any service that pulls springdoc starter)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

