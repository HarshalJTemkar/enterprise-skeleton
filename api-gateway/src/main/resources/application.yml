server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 8KB
  netty:
    connection-timeout: 5s
    idle-timeout: 60s

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      username: ${CONFIG_SERVER_USER:admin}
      password: ${CONFIG_SERVER_PASSWORD:admin}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
    gateway:
      # Global HTTP client / timeouts (every downstream call)
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
        pool:
          max-connections: 500
          acquire-timeout: 45000
        compression: true
      # Default filters applied to every route
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET, OPTIONS, HEAD
            backoff:
              firstBackoff: 100ms
              maxBackoff: 1s
              factor: 2
              basedOnPreviousValue: false
        - name: CircuitBreaker
          args:
            name: defaultCB
            fallbackUri: forward:/fallback
        - name: RequestSize
          args:
            maxSize: 10MB

# Resilience4j defaults for the gateway's CircuitBreaker filter
resilience4j:
  circuitbreaker:
    instances:
      defaultCB:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    instances:
      defaultCB:
        timeout-duration: 5s
        cancel-running-future: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://eureka:eureka@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

enterprise:
  common:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}

# ==================================================================
# Profile: redis-rate-limit
# Activate when Redis is reachable to enable per-IP rate limiting.
# ==================================================================
---
spring:
  config:
    activate:
      on-profile: redis-rate-limit
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET, OPTIONS, HEAD
        - name: CircuitBreaker
          args:
            name: defaultCB
            fallbackUri: forward:/fallback
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${GATEWAY_RL_REPLENISH:50}
            redis-rate-limiter.burstCapacity: ${GATEWAY_RL_BURST:100}
            key-resolver: "#{@ipKeyResolver}"
