server:
  port: ${EUREKA_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: service-registry
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    user:
      name: ${EUREKA_USER:eureka}
      password: ${EUREKA_PASSWORD:eureka}

# ------------------------------------------------------------------
# Eureka server defaults (overridable per profile)
# ------------------------------------------------------------------
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45
    metadata-map:
      zone: ${EUREKA_ZONE:primary}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://${eureka.instance.hostname}:${server.port}/eureka/}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL:30}
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    renewal-percent-threshold: ${EUREKA_RENEWAL_THRESHOLD:0.85}
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL_MS:10000}
    response-cache-update-interval-ms: ${EUREKA_CACHE_UPDATE_MS:5000}
    response-cache-auto-expiration-in-seconds: 180
    peer-eureka-nodes-update-interval-ms: 10000
    wait-time-in-ms-when-sync-empty: 5000
    enable-replicated-request-compression: true

# ------------------------------------------------------------------
# Actuator – health probes + prometheus metrics
# ------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,diskSpace

logging:
  level:
    com.netflix.discovery: INFO
    com.netflix.eureka: INFO

# ==================================================================
# Profile: standalone  (default, single-node Eureka)
# ==================================================================
---
spring:
  config:
    activate:
      on-profile: standalone
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

# ==================================================================
# Profile: peer  (HA replication)
#
# EUREKA_PEER_URLS example:
#   http://eureka:eureka@node2:8761/eureka/,http://eureka:eureka@node3:8761/eureka/
# ==================================================================
---
spring:
  config:
    activate:
      on-profile: peer
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_PEER_URLS}
