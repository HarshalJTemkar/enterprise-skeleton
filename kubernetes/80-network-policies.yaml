# Default-deny all ingress + egress in the namespace, then allow specific flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: enterprise
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Allow DNS to kube-dns for everyone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: enterprise
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Ingress controller -> api-gateway (only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: enterprise
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
---
# api-gateway -> downstream services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-services
  namespace: enterprise
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [auth-service, sample-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
---
# All app pods -> config-server, service-registry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-to-platform
  namespace: enterprise
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [config-server, service-registry] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [api-gateway, auth-service, sample-service, config-server, service-registry] }
---
# Allow Prometheus (assumes it lives in `observability` namespace) to scrape /actuator/prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: enterprise
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8761 }
        - { protocol: TCP, port: 8888 }
        - { protocol: TCP, port: 9000 }
---
# Allow egress within namespace + to OTLP collector + to internet for OAuth/JWKS (DNS first).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress
  namespace: enterprise
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: enterprise
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
