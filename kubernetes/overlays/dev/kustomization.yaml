apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise-dev
nameSuffix: -dev

resources:
  - ../../base

patches:
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

configMapGenerator:
  - name: enterprise-platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - LOG_STYLE=console
      - OTEL_TRACING_ENABLED=false
