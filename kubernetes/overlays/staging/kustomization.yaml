apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise-staging
nameSuffix: -staging

resources:
  - ../../base

patches:
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

configMapGenerator:
  - name: enterprise-platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=staging
