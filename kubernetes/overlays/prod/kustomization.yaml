apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise

resources:
  - ../../base

patches:
  - target: { kind: Deployment, name: auth-service }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: api-gateway }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12

configMapGenerator:
  - name: enterprise-platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - LOG_STYLE=json
      - OTEL_TRACING_ENABLED=true
