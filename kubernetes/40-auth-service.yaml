apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: enterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "9000"
    spec:
      containers:
        - name: auth-service
          image: enterprise/auth-service:latest
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: enterprise-platform-config
            - secretRef:
                name: enterprise-platform-secrets
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: enterprise
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: enterprise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
