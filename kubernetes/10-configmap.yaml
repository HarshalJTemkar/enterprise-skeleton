apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-platform-config
  namespace: enterprise
data:
  # Common environment variables shared across services. Override per-service
  # via deployment env values when needed.
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_THREADS_VIRTUAL_ENABLED: "true"
  LOG_STYLE: "json"
  CONFIG_SERVER_URI: "http://config-server:8888"
  CONFIG_SERVER_USER: "admin"
  EUREKA_SERVICE_URL: "http://eureka:eureka@service-registry:8761/eureka/"
  EUREKA_HOSTNAME: "service-registry"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  OTEL_TRACING_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-platform-secrets
  namespace: enterprise
type: Opaque
stringData:
  # Replace these in real environments via sealed-secrets / Vault.
  JWT_SECRET: "change-me-change-me-change-me-change-me-1234"
  CONFIG_SERVER_PASSWORD: "admin"
  EUREKA_PASSWORD: "eureka"
