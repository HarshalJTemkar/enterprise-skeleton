apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: enterprise
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: enterprise
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-server
  namespace: enterprise
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-registry
  namespace: enterprise
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-service
  namespace: enterprise
automountServiceAccountToken: false
---
# Read-only access to own ConfigMaps/Secrets (least-privilege; scoped to namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enterprise-app-reader
  namespace: enterprise
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enterprise-app-reader
  namespace: enterprise
subjects:
  - kind: ServiceAccount
    name: api-gateway
  - kind: ServiceAccount
    name: auth-service
  - kind: ServiceAccount
    name: config-server
  - kind: ServiceAccount
    name: service-registry
  - kind: ServiceAccount
    name: sample-service
roleRef:
  kind: Role
  name: enterprise-app-reader
  apiGroup: rbac.authorization.k8s.io
