# Default (English) message bundle. Add messages_de.properties, messages_fr.properties, etc.
# Referenced by ErrorCode.messageKey values.

# ---- Generic ----
error.internal=An unexpected error occurred. Please try again later.
error.validation=Request validation failed.
error.bad.request=The request is malformed or missing required parameters.
error.not.found=The requested resource was not found.
error.conflict=The resource is in a conflicting state.
error.method.not.allowed=HTTP method not allowed for this endpoint.
error.unsupported.media.type=Unsupported content type.
error.not.acceptable=Cannot produce a response matching the Accept header.
error.payload.too.large=Request payload exceeds the configured size limit.
error.missing.parameter=A required request parameter is missing.
error.missing.header=A required request header is missing.
error.malformed.json=The request body is not valid JSON.
error.not.implemented=This operation is not implemented.
error.request.timeout=The request timed out.

# ---- Security ----
error.unauthorized=Authentication is required to access this resource.
error.forbidden=You do not have permission to perform this action.
error.invalid.credentials=Invalid username or password.
error.token.expired=Your session has expired. Please log in again.
error.token.invalid=The authentication token is invalid.
error.access.denied=Access denied.
error.account.locked=Account temporarily locked. Please try again later.
error.account.disabled=This account is disabled.
error.account.expired=This account has expired.
error.credentials.expired=Your credentials have expired. Please reset your password.

# ---- Business ----
error.business.rule=A business rule was violated.
error.resource.locked=The resource is currently locked.
error.resource.expired=The resource has expired.
error.duplicate.resource=A resource with the same identifier already exists.
error.optimistic.lock=The resource was modified by another transaction. Please retry.
error.precondition.failed=A precondition for this request was not met.

# ---- Persistence / database ----
error.database=A database error occurred.
error.database.unavailable=The database is currently unavailable.
error.database.timeout=The database query timed out.
error.data.integrity=The request violates a data-integrity constraint.

# ---- Integration ----
error.integration=An error occurred while calling an upstream service.
error.integration.timeout=Timed out calling an upstream service.
error.integration.unavailable=An upstream service is currently unavailable.
error.circuit.open=Upstream service calls are temporarily suspended.
error.bulkhead.full=Concurrent capacity exceeded. Please retry later.

# ---- Rate limiting / idempotency ----
error.too.many.requests=Too many requests. Please slow down.
error.idempotency.replay=Duplicate request detected; original result cached.

# ---- App-level ----
app.welcome=Welcome, {0}!
app.goodbye=Goodbye, {0}.
